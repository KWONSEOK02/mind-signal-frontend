language: ko-KR
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - dev
  path_instructions:
    - path: "**"
      instructions: |
        확정된 설계 결정이다. 아래를 되돌리라는 제안은 하지 말 것 — 근거는
        계획 문서에 있으나 그 문서는 git 밖이라 이 레포에서 확인할 수 없다.

        - vitest.config.ts 의 test.browser.api 는 port 를 고정하고 strictPort 를
          true 로 둔다. 이것이 의도다. vitest 브라우저 모드의 기본 포트 63315 가
          Windows 예약 포트 대역(netsh excludedportrange)에 상시 포함돼 EACCES 로
          죽기 때문이다. strictPort 를 false 로 낮추라는 제안은 하지 말 것 —
          조용한 포트 폴백이 정확히 그 증상을 다시 숨긴다.
        - 사용자 노출 문구는 한글 표기가 정본이다. 히어로의 "뇌파 / 시그널" 을
          영문으로 바꾸라고 하지 말 것. e2e/home.spec.ts 가 한글을 검증한다.
        - public/Images 의 대문자 I 는 의도다. 소문자로 바꾸면 Vercel(Linux)에서
          404 가 난다. 경로 대소문자를 정규화하라고 제안하지 말 것.
    - path: "src/07-shared/**"
      instructions: |
        07-shared는 최하위 레이어. 다른 레이어(05-features, 03-pages 등)를 import하면 위반.
        process.env 직접 접근 금지 — config.ts의 config 객체 사용 필수.
    - path: "src/05-features/**"
      instructions: |
        FSD 규칙: 05-features는 07-shared만 import 가능. 03-pages, 04-widgets import 금지.
        API 호출은 07-shared/api의 Axios 인스턴스 사용 — fetch() 직접 사용 금지.
    - path: "src/03-pages/**"
      instructions: |
        FSD 규칙: 03-pages는 04-widgets, 05-features, 07-shared import 가능.
        다른 page를 직접 import하면 위반.
    - path: "src/**/*.tsx"
      instructions: |
        any 타입 사용 금지. Props 타입 명시 필수.
        hooks, 브라우저 API, 이벤트 핸들러 사용 시 'use client' 선언 확인.
        React Server/Client Component 경계 위반 여부.
        보안: 하드코딩된 시크릿, unsafe innerHTML, 미검증 리다이렉트.
        포매팅(스타일) 무시 — Prettier가 통제함.
    - path: "src/**/*.test.{ts,tsx}"
      instructions: |
        퍼블릭 함수당 happy path + 최소 1개 에러 경로 테스트 커버리지.
        구현 세부사항이 아닌 관찰 가능한 동작 테스트 여부.
        포매팅 무시.
    - path: "e2e/**/*.spec.ts"
      instructions: |
        E2E 테스트 안정성: flaky selector 사용 여부 (data-testid 권장).
        테스트 간 상태 격리 여부.
chat:
  auto_reply: true

# --- 2026-08-27 추가: 프로젝트 컨텍스트 학습 ---
# 기본 code_guidelines 패턴은 CLAUDE.md 를 읽는데 이 레포의 CLAUDE.md 는
# `@AGENTS.md` 한 줄 import 껍데기라 실질적으로 빈 파일이었다. 직접 가리킨다.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - ".agents/rules/*.md"
